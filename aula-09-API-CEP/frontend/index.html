<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pacientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <div id="alerta" class="alert d-none" role="alert"></div>

    <form id="form-paciente" class="row g-3 mb-5 bg-white p-4 rounded shadow-sm">
      <input type="hidden" id="id">

      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>

      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="col-md-4">
        <label for="nascimento" class="form-label">Nascimento</label>
        <input type="date" class="form-control" id="nascimento" required>
      </div>

      <!-- Endereço (ViaCEP) -->
      <div class="col-md-2">
        <label for="cep" class="form-label">CEP</label>
        <input type="text" class="form-control" id="cep" maxlength="8"
               inputmode="numeric" placeholder="Só números">
        <div id="cep-ajuda" class="form-text"></div>
      </div>

      <div class="col-md-5">
        <label for="logradouro" class="form-label">Logradouro</label>
        <input type="text" class="form-control" id="logradouro">
      </div>

      <div class="col-md-3">
        <label for="cidade" class="form-label">Cidade</label>
        <input type="text" class="form-control" id="cidade">
      </div>

      <div class="col-md-2">
        <label for="uf" class="form-label">UF</label>
        <input type="text" class="form-control" id="uf" maxlength="2">
      </div>

      <div class="col-12 d-flex gap-2">
        <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button>
        <button type="button" id="btn-cancelar" class="btn btn-outline-secondary d-none">Cancelar</button>
      </div>
    </form>

    <div class="table-responsive bg-white rounded shadow-sm">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Nascimento</th>
            <th>Cidade/UF</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-pacientes"></tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
