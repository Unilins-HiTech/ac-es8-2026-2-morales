<!DOCTYPE html>

<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Usuários e Posts — JSONPlaceholder</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <div class="container py-5">

    <h1 class="mb-4">Usuários (JSONPlaceholder)</h1>

    <!-- Spinner de carregamento -->
    <div id="carregando" class="text-center my-4">

      <div class="spinner-border text-primary" role="status">

        <span class="visually-hidden">Carregando...</span>

      </div>

    </div>

    <!-- Campo de busca -->
    <div class="mb-4">

      <input
        type="text"
        id="busca-usuario"
        class="form-control"
        placeholder="Buscar usuário por nome..."
      >

    </div>

    <!-- Tela 1: lista de usuários -->
    <div id="tela-lista" class="row g-3"></div>

    <!-- Tela 2: posts do usuário -->
    <div id="tela-detalhe" class="d-none">

      <button
        id="btn-voltar"
        class="btn btn-outline-secondary mb-3"
      >
        ← Voltar
      </button>

      <h2
        id="detalhe-nome"
        class="h4 mb-2"
      ></h2>

      <p
        id="contador-posts"
        class="text-muted"
      ></p>

      <ul
        id="lista-posts"
        class="list-group"
      ></ul>

    </div>

    <!-- Tela 3: comentários do post -->
    <div id="tela-comentarios" class="d-none">

      <button
        id="btn-voltar-posts"
        class="btn btn-outline-secondary mb-3"
      >
        ← Voltar
      </button>

      <h2 class="h4 mb-3">
        Comentários
      </h2>

      <ul
        id="lista-comentarios"
        class="list-group"
      ></ul>

    </div>

  </div>

  <script src="js/app.js"></script>

</body>

</html>
