<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pacientes</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <!-- Formulário de Cadastro -->
    <form id="form-paciente" class="row g-3 mb-5">
      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>

      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="col-md-3">
        <label for="nascimento" class="form-label">Data de nascimento</label>
        <input type="date" class="form-control" id="nascimento" required>
      </div>

      <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">+</button>
      </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Pacientes cadastrados</h2>
      <!-- Contador por Origem (Issue 2) -->
      <div id="contador-origem" class="badge bg-secondary p-2 fs-6">
        JSON: 0 | Local: 0
      </div>
    </div>

    <!-- Mensagem de carregamento (Issue 1 - Simulação de latência) -->
    <p id="carregando" class="text-muted fw-bold">Carregando pacientes...</p>

    <!-- Mensagem para Tratamento de Erro Amigável (Issue 4) -->
    <div id="mensagem-erro" class="alert alert-danger d-none" role="alert"></div>

    <!-- Mensagem para Tratamento de Lista Vazia (Issue 3) -->
    <div id="mensagem-vazia" class="alert alert-warning d-none" role="alert">
      Nenhum paciente cadastrado ainda
    </div>

    <!-- Tabela de Pacientes -->
    <table id="tabela-container" class="table table-striped d-none">
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Data de nascimento</th>
        </tr>
      </thead>
      <tbody id="tabela-pacientes"></tbody>
    </table>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
